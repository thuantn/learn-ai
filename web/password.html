<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đổi mật khẩu</title>
<meta name="theme-color" content="#0b0d12">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/theme.js"></script>
<script src="/static/auth-page.js" defer></script>
</head>
<body class="auth-page">
<main class="auth-console">
  <div class="status-pill">Lần đăng nhập đầu</div>
  <h1 class="hero-title auth-title">Đổi mật khẩu</h1>
  <p class="auth-lead">Hãy đặt mật khẩu của riêng bạn, ít nhất 15 ký tự. Một câu ngắn dễ nhớ là lựa chọn tốt.</p>
  <div id="alertBox" class="studio-alert" role="alert" aria-live="assertive"></div>
  <form id="passwordForm" novalidate>
    <div class="auth-field">
      <label for="pass1" class="auth-label">Mật khẩu mới</label>
      <div class="auth-input-box">
        <input type="password" id="pass1" class="auth-input" autocomplete="new-password" required>
        <button type="button" class="btn-pwd-eye" data-eye="pass1">Hiện</button>
      </div>
    </div>
    <div class="auth-field">
      <label for="pass2" class="auth-label">Nhập lại</label>
      <div class="auth-input-box">
        <input type="password" id="pass2" class="auth-input" autocomplete="new-password" required>
        <button type="button" class="btn-pwd-eye" data-eye="pass2">Hiện</button>
      </div>
    </div>
    <button type="submit" class="btn-studio-primary fc-wide" id="submitBtn">Lưu mật khẩu mới</button>
  </form>
  <p class="admin-note"><button type="button" class="link-btn" id="leave">Đăng xuất</button></p>
</main>
</body>
</html>
