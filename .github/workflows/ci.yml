name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements.txt
      - run: pip install pytest httpx pip-audit
      - run: python -m pytest -q tests/test_contract.py tests/test_test_format.py tests/test_test_install.py tests/test_bundle.py tests/test_convert.py tests/test_server.py tests/test_sandbox.py tests/test_catalog.py tests/test_uploads.py tests/test_share.py tests/test_ai.py tests/test_admin.py tests/test_toolkit.py
      - run: pip-audit --require-hashes -r requirements.txt
      - run: docker build .
